<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AdKaizen CRM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root { --font-sora: "Sora"; --font-inter: "Inter"; }
/* The Kaizen Agency: calm, plain. No gradients, no glows. */
:root {
  --royal: #2f6bff;
  --royal-ink: #1f4fd1;
  --royal-soft: #eaf0ff;
  --navy: #0b1226;
  --navy-2: #151d36;
  --emerald: #10b981;
  --emerald-ink: #047857;
  --emerald-soft: #e7f7f0;
  --amber-ink: #92400e;
  --amber-soft: #fdf3e2;
  --red-ink: #b42318;
  --red-soft: #fdecea;

  --bg: #f6f7fa;
  --surface: #ffffff;
  --ink: #0b1226;
  --ink-2: #48506a;
  --ink-3: #7a8199;
  --line: #e3e6ee;
  --line-2: #eef0f5;

  --radius: 10px;
  --font-head: var(--font-sora), "Sora", system-ui, sans-serif;
  --font-body: var(--font-inter), "Inter", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; letter-spacing: -0.01em; margin: 0; color: var(--ink); }
h1 { font-size: 24px; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }
a { color: var(--royal-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
small, .muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
.side {
  background: var(--navy);
  color: #c9cfe0;
  padding: 22px 14px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: sticky; top: 0; height: 100vh;
}
.side .brand img { height: 30px; display: block; margin: 0 8px; }
.side .tag { font-size: 12px; color: #8a92ad; margin: 8px 10px 0; }
.side nav { display: flex; flex-direction: column; gap: 2px; }
.side nav a {
  color: #c9cfe0; padding: 8px 10px; border-radius: 8px; font-size: 14px; text-decoration: none;
}
.side nav a:hover { background: var(--navy-2); color: #fff; }
.side nav a[aria-current="page"] { background: var(--navy-2); color: #fff; box-shadow: inset 3px 0 0 var(--emerald); }
.side .foot { margin-top: auto; font-size: 13px; padding: 0 10px; }
.side .foot .who { color: #fff; font-weight: 500; }
.side .foot button { margin-top: 8px; background: none; border: 1px solid #2a3352; color: #c9cfe0; padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
.side .foot button:hover { border-color: #46507a; color: #fff; }

.main { padding: 28px 36px 60px; max-width: 1180px; width: 100%; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head p { color: var(--ink-2); margin-top: 4px; }
.crumb { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }

@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px 16px; gap: 12px; }
  .side .tag { display: none; }
  .side nav { flex-direction: row; flex-wrap: wrap; }
  .side .foot { margin: 0 0 0 auto; display: flex; align-items: center; gap: 10px; }
  .side .foot button { margin: 0; }
  .main { padding: 20px 16px 48px; }
}

/* ---------- surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.card + .card { margin-top: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head p { color: var(--ink-3); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3 { grid-template-columns: 1fr; } }
@media (max-width: 640px) { .grid-2, .grid-4 { grid-template-columns: 1fr; } }

.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat .label { font-size: 13px; color: var(--ink-2); }
.stat .value { font-family: var(--font-head); font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .delta { font-size: 12.5px; margin-top: 2px; color: var(--ink-3); }
.delta.good { color: var(--emerald-ink); }
.delta.bad { color: var(--red-ink); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
td a[href*="/invoices/"] { white-space: nowrap; }
.empty { padding: 28px; text-align: center; color: var(--ink-3); font-size: 14px; }

/* ---------- badges ---------- */
.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); white-space: nowrap; }
.badge.paid, .badge.active, .badge.captured { background: var(--emerald-soft); color: var(--emerald-ink); }
.badge.overdue, .badge.failed, .badge.churned { background: var(--red-soft); color: var(--red-ink); }
.badge.due, .badge.onboarding, .badge.paused { background: var(--amber-soft); color: var(--amber-ink); }
.badge.upcoming, .badge.created { background: var(--royal-soft); color: var(--royal-ink); }
.badge.test { background: var(--amber-soft); color: var(--amber-ink); }

/* ---------- forms ---------- */
label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-2); font-weight: 500; }
input, select, textarea {
  font: inherit; font-size: 14px; color: var(--ink);
  background: #fff; border: 1px solid #d5d9e3; border-radius: 8px; padding: 8px 10px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--royal-soft); border-color: var(--royal); }
textarea { min-height: 76px; resize: vertical; }
input[type="checkbox"] { width: auto; }
.check { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.form-row > label { flex: 1 1 140px; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.hint { font-size: 12.5px; color: var(--ink-3); font-weight: 400; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: inherit; font-size: 14px; font-weight: 500; line-height: 1;
  padding: 10px 14px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; white-space: nowrap;
  background: var(--royal); color: #fff; text-decoration: none;
}
.btn:hover { background: var(--royal-ink); text-decoration: none; }
.btn.secondary { background: #fff; color: var(--ink); border-color: #d5d9e3; }
.btn.secondary:hover { background: var(--bg); }
.btn.ghost { background: none; color: var(--ink-2); padding: 6px 8px; }
.btn.ghost:hover { background: var(--line-2); color: var(--ink); }
.btn.danger { background: #fff; color: var(--red-ink); border-color: #f1c8c3; }
.btn.danger:hover { background: var(--red-soft); }
.btn.pay { background: var(--emerald-ink); }
.btn.pay:hover { background: #065f46; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.55; cursor: not-allowed; }

.notice { border-radius: 8px; padding: 10px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); }
.notice.ok { background: var(--emerald-soft); border-color: #bfe8d6; color: var(--emerald-ink); }
.notice.err { background: var(--red-soft); border-color: #f1c8c3; color: var(--red-ink); }
.notice.warn { background: var(--amber-soft); border-color: #f2dcb4; color: var(--amber-ink); }
.notice.info { background: var(--royal-soft); border-color: #cbd8ff; color: var(--royal-ink); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
.tabs a { padding: 9px 12px; color: var(--ink-2); font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--ink); text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--royal); font-weight: 500; }

.kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }

.copy { display: flex; gap: 8px; }
.copy input { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }

details > summary { cursor: pointer; color: var(--royal-ink); font-size: 14px; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
details[open] > summary { margin-bottom: 12px; }

/* ---------- auth pages ---------- */
.auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.auth .box { width: 100%; max-width: 400px; }
.auth .logo { height: 34px; margin-bottom: 26px; }
.auth .card { padding: 26px; }
.auth h1 { font-size: 21px; margin-bottom: 6px; }
.auth form { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.auth .btn { width: 100%; padding: 12px; }
.auth .below { text-align: center; color: var(--ink-3); font-size: 13px; margin-top: 18px; }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-body); font-size: 11px; fill: var(--ink-3); }
.chart .grid line { stroke: var(--line-2); }
.chart .axis { stroke: var(--line); }
.chart rect.bar { fill: var(--royal); }
.chart rect.bar:hover { fill: var(--royal-ink); }
.chart .line { fill: none; stroke: var(--emerald); stroke-width: 2; }
.chart .dot { fill: var(--surface); stroke: var(--emerald); stroke-width: 2; }
.chart .vlabel { fill: var(--ink-2); font-weight: 500; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); margin-top: 6px; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--royal); }
.legend span.em::before { background: var(--emerald); height: 3px; vertical-align: 3px; border-radius: 2px; }

.sandbox-pay { max-width: 460px; margin: 40px auto; }

/* ---------- invoice ---------- */
.invoice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 36px 40px; max-width: 820px; }
.invoice .pre { white-space: pre-line; }
.inv-head { display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; padding-bottom: 22px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.inv-logo { height: 30px; display: block; margin-bottom: 14px; }
.inv-from { font-size: 13.5px; color: var(--ink-2); line-height: 1.6; }
.inv-from strong { color: var(--ink); }
.inv-meta { text-align: right; }
.inv-meta h1 { font-size: 22px; margin-bottom: 10px; }
.inv-meta dl { display: grid; grid-template-columns: auto auto; gap: 4px 14px; margin: 0 0 10px; font-size: 13.5px; justify-content: end; }
.inv-meta dt { color: var(--ink-3); }
.inv-meta dd { margin: 0; font-weight: 500; }
.inv-to { font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
.inv-lines tfoot td { border-bottom: none; padding: 6px 10px; }
.inv-lines tfoot tr:first-child td { border-top: 1px solid var(--line); padding-top: 12px; }
.inv-total td { font-family: var(--font-head); font-weight: 600; font-size: 16px; color: var(--ink); }
.inv-foot { margin-top: 30px; font-size: 13px; }
.inv-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
@media (max-width: 640px) { .invoice { padding: 22px 18px; } .inv-meta { text-align: left; } .inv-meta dl { justify-content: start; } }

.explain { font-size: 12.5px; color: var(--ink-3); margin-top: 4px; }
.summary { font-size: 15px; line-height: 1.65; color: var(--ink-2); }
.summary strong { color: var(--ink); }

.line-items { display: grid; grid-template-columns: 1fr 90px 160px; gap: 8px; align-items: end; }
.line-items .h { font-size: 13px; color: var(--ink-2); font-weight: 500; }
@media (max-width: 640px) { .line-items { grid-template-columns: 1fr 70px 110px; } }

@media print {
  @page { margin: 14mm; }
  body { background: #fff; }
  .side, .no-print, .inv-actions, nextjs-portal { display: none !important; }
  .shell { display: block; }
  .main { padding: 0; max-width: none; }
  .invoice { border: none; padding: 0; max-width: none; }
  .badge { border: 1px solid currentColor; }
}

/* Pipeline board and task lists */
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.board-col { background: var(--line-2); border-radius: var(--radius); padding: 10px; min-height: 120px; }
.board-col h3 { font-size: 14px; margin: 2px 4px 2px; display: flex; justify-content: space-between; }
.board-col .sub { font-size: 12.5px; color: var(--ink-3); margin: 0 4px 10px; }
.deal { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; color: var(--ink); }
.deal:hover { border-color: var(--royal); text-decoration: none; }
.deal .t { font-weight: 600; font-size: 14px; }
.deal .m { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.deal .late { color: var(--red-ink); font-weight: 500; }
.timeline { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 12px; }
.timeline li { border-top: 1px solid var(--line-2); padding-top: 10px; }
.timeline .who { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
@media (max-width: 960px) { .board { grid-template-columns: repeat(4, 240px); } }
.task-list { list-style: none; padding: 0; margin: 0; }
.task-row { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line-2); }
.task-list .task-row:first-child { border-top: 0; }
.tick { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--ink-3); background: var(--surface); cursor: pointer; padding: 0; font-size: 13px; line-height: 1; color: #fff; margin-top: 1px; }
.tick:hover { border-color: var(--emerald); }
.tick.on { background: var(--emerald); border-color: var(--emerald); }
.task-done { color: var(--ink-3); text-decoration: line-through; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.loading { min-height: 60vh; display: grid; place-items: center; color: var(--ink-3); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; max-width: min(560px, calc(100vw - 32px)); box-shadow: 0 6px 24px rgba(11,18,38,.12); }
.busy-bar { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--royal); z-index: 60; animation: kzbusy 1.2s ease-in-out infinite; transform-origin: left; }
@keyframes kzbusy { 0% { transform: scaleX(.05); } 50% { transform: scaleX(.7); } 100% { transform: scaleX(.05); translate: 100% 0; } }
@media (prefers-reduced-motion: reduce) { .busy-bar { animation: none; } }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; }
.check.area { align-items: flex-start; }
.check.area .hint { display: block; font-weight: 400; }
code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--line-2); padding: 1px 5px; border-radius: 4px; }
pre.box { white-space: pre-wrap; font-size: 12.5px; background: var(--bg); padding: 10px; border-radius: 8px; margin: 0 0 10px; overflow-x: auto; }
/* overview + review */
.ic { flex-shrink: 0; vertical-align: -3px; }
.card-head h2 { display: flex; align-items: center; gap: 8px; }
.card-head h2 .ic { color: var(--royal); }
.hero { background: var(--navy); color: #fff; border-radius: 14px; padding: 26px 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; }
.hero h1 { color: #fff; font-size: 28px; margin: 2px 0 6px; }
.hero-date { color: #8f98b5; font-size: 13.5px; margin: 0; }
.hero-sub { color: #c9cfe0; margin: 0; }
.hero-sub strong { color: #fff; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 13.5px; font-weight: 500; text-decoration: none; background: rgba(255,255,255,.06); }
.hero-btn:hover { background: rgba(255,255,255,.14); }
.hero-btn:first-child { background: var(--royal); border-color: var(--royal); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; color: var(--ink); text-decoration: none; transition: border-color .15s; }
.kpi:hover { border-color: var(--royal); }
.kpi-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.kpi-ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--royal-soft); color: var(--royal-ink); }
.kpi-ic.green { background: var(--emerald-soft); color: var(--emerald-ink); }
.kpi-val { font-family: var(--font-head); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi-val small { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.kpi-label { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.kpi-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.pos { color: var(--emerald-ink); }
.neg { color: var(--red-ink); }
.meter { height: 8px; border-radius: 99px; background: var(--line-2); overflow: hidden; }
.meter span { display: block; height: 100%; border-radius: 99px; background: var(--royal); }
.meter span.green { background: var(--emerald); }
.meter span.red { background: var(--red-ink); }
.todo { list-style: none; margin: 0; padding: 0; }
.todo li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-2); }
.todo li:first-child { border-top: 0; padding-top: 0; }
.todo-ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex-shrink: 0; background: var(--royal-soft); color: var(--royal-ink); }
.todo li.red .todo-ic { background: var(--red-soft); color: var(--red-ink); }
.todo li.amber .todo-ic { background: var(--amber-soft); color: var(--amber-ink); }
.todo a { flex: 1; min-width: 0; color: var(--ink); text-decoration: none; display: flex; flex-direction: column; }
.todo a strong { font-weight: 500; }
.todo a span { font-size: 12.5px; color: var(--ink-3); }
.todo a:hover strong { color: var(--royal-ink); }
.todo .go { color: var(--ink-3); }
.allclear { display: flex; gap: 14px; align-items: center; color: var(--emerald-ink); padding: 6px 0; }
.allclear p { color: var(--ink-2); margin: 0; }
.start { margin-bottom: 16px; }
.start-pct { font-family: var(--font-head); font-size: 22px; font-weight: 600; color: var(--emerald-ink); }
.steps { list-style: none; padding: 0; margin: 14px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; }
.steps li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.steps li.done { color: var(--ink-3); }
.steps .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex-shrink: 0; }
.steps li.done .dot { background: var(--emerald); border-color: var(--emerald); color: #fff; }
.glance { display: grid; gap: 14px; }
.glance-row { display: flex; justify-content: space-between; font-size: 13.5px; margin-bottom: 5px; color: var(--ink-2); }

    if (f.getAttribute('data-filter') === 'leads') { delete q.status; delete q.due; }
    go(r.parts.join('/'), q); return;
  }
  var name = f.getAttribute('data-form');
  if (!name || !FORMS[name]) return;
  e.preventDefault();
  var c = f.getAttribute('data-confirm'); if (c && !window.confirm(c)) return;
  var fd = new FormData(f), o = {}; fd.forEach(function (v, k) { if (typeof v === 'string') o[k] = v; });
  var b = f.querySelector('[type=submit]'), txt = b ? b.innerHTML : '';
  if (b) { b.disabled = true; b.innerHTML = 'Saving…'; }
  var key = f.getAttribute('data-key');
  S.msg = null;
  Promise.resolve().then(function () { return FORMS[name](o, fd, f); }).then(function (res) {
    if (res === undefined) return;
    done(key, res);
    if (/^add|^save|^invite|^create/.test(name) && !o.id && (res && res.link === undefined)) { var nf2 = app.querySelector('[data-key="' + key + '"]'); if (nf2 && nf2.reset && name !== 'saveSettings' && name !== 'savePlan') nf2.reset(); }
  }, function (err) {
    if (document.body.contains(f)) { if (b) { b.disabled = false; b.innerHTML = txt; } var old = f.querySelector('.notice'); if (old) old.remove(); f.insertAdjacentHTML('beforeend', '<p class="notice err" role="alert" style="margin-top:10px">' + esc(err.message) + '</p>'); }
    else showToast(err.message, true);
  });
});
app.addEventListener('change', function (e) {
  var f = e.target.form; if (!f) return;
  if (e.target.hasAttribute('data-team')) {
    var t = TEAMS.filter(function (x) { return x[0] === e.target.value; })[0];
    if (t && t[0] !== 'custom') f.querySelectorAll('[name=perm]').forEach(function (b) { b.checked = t[2].indexOf(b.value) >= 0; });
  } else if (e.target.name === 'perm') {
    if (e.target.value === 'accounts' && e.target.checked) f.querySelector('[name=perm][value=billing]').checked = true;
    if (e.target.value === 'billing' && !e.target.checked) f.querySelector('[name=perm][value=accounts]').checked = false;
    var cur = [].slice.call(f.querySelectorAll('[name=perm]:checked')).map(function (b) { return b.value; }).sort().join(',');
    var m = TEAMS.filter(function (x) { return x[0] !== 'custom' && x[2].slice().sort().join(',') === cur; })[0];
    var sel = f.querySelector('[data-team]'); if (sel) sel.value = m ? m[0] : 'custom';
  }
});
app.addEventListener('click', function (e) {
  var cp = e.target.closest('[data-copy]');
  if (cp) { if (navigator.clipboard) navigator.clipboard.writeText(cp.getAttribute('data-copy')); cp.textContent = 'Copied'; return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act'); if (!ACTS[act]) return;
  e.preventDefault();
  var c = el.getAttribute('data-confirm'); if (c && !window.confirm(c)) return;
  var data = {}; Array.prototype.slice.call(el.attributes).forEach(function (a) { if (a.name.indexOf('data-') === 0) data[a.name.slice(5)] = a.value; });
  el.disabled = true;
  S.msg = null;
  Promise.resolve().then(function () { return ACTS[act](data, el); }).then(function (res) {
    if (typeof res === 'string') showToast(res, false);
    if (route().parts.length || true) render();
  }, function (err) { el.disabled = false; showToast(err.message, true); });
});

boot();
})();
</script>
